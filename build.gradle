plugins {
	id 'java'
	id 'application'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex('net\\.runelite.*')
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.13.2'
	testImplementation 'org.mockito:mockito-core:5.14.2'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
}

group = 'com.leadman'
version = '1.0.0'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(11)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
	options.compilerArgs << '-Xlint:deprecation' << '-Xlint:unchecked'
}

// `gradle run` starts a real RuneLite client with Leadman registered as a built-in.
// The launcher lives in the test source set so it never ships inside the plugin jar.
application {
	mainClass = 'com.leadman.LeadmanPluginLauncher'
}

tasks.named('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	jvmArgs '-ea'
}

tasks.named('test', Test) {
	testLogging {
		events 'passed', 'failed', 'skipped'
	}
}

tasks.register('coverageReport', Exec) {
	group = 'leadman'
	description = 'Lists GE tradeables without a generated item rule (docs/ge-unmapped.txt)'
	commandLine 'node', 'tools/coverage-report.mjs'
	workingDir = projectDir
}
